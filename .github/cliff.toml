[changelog]
header = ""
body = """
{%- set groups = ["新增", "修复", "优化与重构", "样式与体验", "移除", "文档", "测试", "构建与发布", "其他"] -%}
{%- for group in groups -%}
{%- set items = commits | filter(attribute="group", value=group) -%}
{%- if items | length > 0 -%}
#### {{ group }}
{% for commit in items -%}
- {{ commit.message | split(pat="\n") | first }}
{% endfor %}
{% endif -%}
{%- endfor -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^feat", group = "新增" },
  { message = "^fix", group = "修复" },
  { message = "^refactor", group = "优化与重构" },
  { message = "^perf", group = "优化与重构" },
  { message = "^style", group = "样式与体验" },
  { message = "^revert", group = "移除" },
  { message = "移除|删除|remove|drop", group = "移除" },
  { message = "^docs", group = "文档" },
  { message = "^test", group = "测试" },
  { message = "^ci", group = "构建与发布" },
  { message = "^build", group = "构建与发布" },
  { message = "^chore: 发布|^chore\\(release\\)", skip = true },
  { message = "^chore", group = "其他" },
  { message = ".*", group = "其他" },
]
protect_breaking_commits = false
filter_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
